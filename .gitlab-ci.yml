# ffmpeg-wasi — custom release pipeline.
#
#   merge_request → validate (shellcheck the build scripts; fast)
#   tag nX.Y.Z-N  → build both variants → checksum + provenance → GitLab release
#
# Releases are cut by tagging `<FFMPEG_VERSION>-<build-rev>` (e.g. n8.1.2-1); the
# FFmpeg version is derived from the tag. The build is heavy (compiles FFmpeg);
# it runs only on tags and needs a Docker-capable runner with adequate
# CPU/disk/timeout.

include:
  # Docs site → GitLab Pages (zensical), consistent with the other phpboyscout projects.
  - component: gitlab.com/phpboyscout/cicd/zensical-pages@v0.18.1

stages:
  - validate
  - build
  - sign
  - release
  - pages

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

validate:
  stage: validate
  # The alpine variant ships a shell (the scratch shellcheck image sets shellcheck
  # as its entrypoint, which collides with GitLab's script runner).
  image:
    name: koalaman/shellcheck-alpine:stable
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - shellcheck build/*.sh

# One job per licence variant; the FFmpeg version comes from the tag (strip the
# build-revision suffix, e.g. n8.1.2-1 -> n8.1.2). The job runs *in* the wasi-sdk
# image and invokes the build scripts directly — same as build/Dockerfile, but no
# Docker-in-Docker (so it runs on an ordinary container runner).
.build:
  stage: build
  image: ghcr.io/webassembly/wasi-sdk:wasi-sdk-30
  tags: [saas-linux-medium-amd64]
  rules:
    # Only FFmpeg-version tags (e.g. n8.1.2-1) build artifacts; repo-meta tags
    # like 0.1.0 do not trigger an FFmpeg build.
    - if: '$CI_COMMIT_TAG =~ /^n[0-9]/'
  timeout: 2h
  before_script:
    # curl + xz-utils + meson/ninja are needed by the intermediate profile (its
    # external libs are fetched tarballs; harfbuzz/fribidi are meson builds). They
    # are harmless for the lean profile, which uses neither.
    - apt-get update && apt-get install -y --no-install-recommends git make pkg-config gzip ca-certificates curl xz-utils meson ninja-build && rm -rf /var/lib/apt/lists/*
  script:
    - export FFMPEG_VERSION="${CI_COMMIT_TAG%-*}"
    # Artifact name: lean keeps the legacy ffmpeg-wasi-<variant>.wasm; a non-lean
    # profile carries the profile in the name (spec 0022). PROFILE reaches deps.sh
    # and libav.sh via the environment (a GitLab job variable), defaulting to lean.
    - 'if [ "${PROFILE:-lean}" = lean ]; then NAME="ffmpeg-wasi-${VARIANT}"; else NAME="ffmpeg-wasi-${PROFILE}-${VARIANT}"; fi'
    - echo "Building ${NAME} for FFmpeg ${FFMPEG_VERSION}"
    - sh build/deps.sh
    - sh build/libav.sh
    - mkdir -p dist
    - OUT="dist/${NAME}.wasm" sh build/driver.sh
    - cp "dist/${NAME}.wasm" "${NAME}.wasm"
    - gzip -k -9 "${NAME}.wasm"
  artifacts:
    paths:
      - "ffmpeg-wasi-*.wasm*"
    expire_in: 1 week

build:lgpl:
  extends: .build
  variables:
    VARIANT: lgpl

build:gpl:
  extends: .build
  variables:
    VARIANT: gpl

# The intermediate profile (spec 0022): lean + every practical software codec/
# filter (subtitles, LGPL encoders, native codec batch, burn-in). Published
# alongside lean so a consumer gets the full advertised capability.
build:lgpl:intermediate:
  extends: .build
  variables:
    VARIANT: lgpl
    PROFILE: intermediate

build:gpl:intermediate:
  extends: .build
  variables:
    VARIANT: gpl
    PROFILE: intermediate

# The native Backend-B drivers (spec 0028): our libav-direct engine compiled to a
# native ELF (linux/amd64) with threads + SIMD via TARGET=native — published and
# signed alongside the wasm modules, so a consumer can fetch a *certified* native
# driver (afmpeg native.WithNativeRelease) for 48–58× faster software encode. It
# runs the same build scripts as the wasm jobs, in a native toolchain image; the
# lean profile (H.264 encode + the native baseline).
.build-native:
  stage: build
  image: debian:bookworm-slim
  tags: [saas-linux-medium-amd64]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^n[0-9]/'
  timeout: 2h
  variables:
    TARGET: native
    PROFILE: lean
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git make pkg-config gzip ca-certificates build-essential nasm zlib1g-dev && rm -rf /var/lib/apt/lists/*
  script:
    - export FFMPEG_VERSION="${CI_COMMIT_TAG%-*}"
    - NAME="ffmpeg-wasi-driver-linux-amd64-${VARIANT}"
    - echo "Building ${NAME} for FFmpeg ${FFMPEG_VERSION}"
    - sh build/deps.sh
    - sh build/libav.sh
    - mkdir -p dist
    - OUT="dist/${NAME}" sh build/driver.sh
    - cp "dist/${NAME}" "${NAME}"
    - gzip -k -9 "${NAME}"
  artifacts:
    paths:
      - "ffmpeg-wasi-driver-*"
    expire_in: 1 week

build:native:lgpl:
  extends: .build-native
  variables:
    VARIANT: lgpl

build:native:gpl:
  extends: .build-native
  variables:
    VARIANT: gpl

# Sign the release manifest. Tag-gated; uses GitLab OIDC to assume the
# ffmpeg-wasi signer role, then `gtb` mints the OpenPGP public key from the KMS
# key and signs checksums.txt with a detached OpenPGP signature (afmpeg spec
# 0010, via gitlab.com/phpboyscout/signing). The signer role's trust policy
# (phpboyscout/infra) pins it to this project's `n*` tag pipelines.
sign:
  stage: sign
  image: golang:1.26
  tags: [saas-linux-medium-amd64]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^n[0-9]/'
  needs:
    - build:lgpl
    - build:gpl
    - build:lgpl:intermediate
    - build:gpl:intermediate
    - build:native:lgpl
    - build:native:gpl
  id_tokens:
    AWS_WEB_IDENTITY_TOKEN:
      # The IAM OIDC provider hardcodes client_id_list=["sts.amazonaws.com"];
      # the signer role's trust policy matches via oidc_audience. AWS checks
      # this `aud` before the role's trust condition.
      aud: sts.amazonaws.com
  variables:
    AWS_REGION: eu-west-2
    AWS_ROLE_ARN: arn:aws:iam::049815585546:role/ffmpeg-wasi-release-signing-v1-signer
    AWS_ROLE_SESSION_NAME: ffmpeg-wasi-release-${CI_COMMIT_TAG}
    # A job variable, not a before_script export — GitLab runs each script line
    # in its own shell, so exports don't persist (gtb's aws-kms backend reads
    # this path + AWS_ROLE_ARN to assume the role via web-identity).
    AWS_WEB_IDENTITY_TOKEN_FILE: /tmp/oidc-token
    SIGNING_KEY_ALIAS: alias/ffmpeg-wasi-release-signing-v1
    # The OpenPGP UID + creation time are FIXED so every mint reproduces the same
    # key fingerprint (710881C1DDAEABD138E53004A2166E59EB6060E1) — the one afmpeg
    # pins. Changing any of these rotates the key.
    SIGNING_KEY_NAME: ffmpeg-wasi Release Signing
    SIGNING_KEY_EMAIL: ffmpeg-wasi-release@phpboyscout.uk
    SIGNING_KEY_CREATED: "2026-06-30T00:00:00Z"
    GTB_VERSION: v0.27.2
    GOPRIVATE: gitlab.com/phpboyscout/*
  before_script:
    # Install gtb from the private module registry (CI-token git auth), then
    # stage the OIDC token for the AWS SDK credential chain.
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"
    - go install "gitlab.com/phpboyscout/go-tool-base/cmd/gtb@${GTB_VERSION}"
    - echo "$AWS_WEB_IDENTITY_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
  script:
    - export PATH="$(go env GOPATH)/bin:$PATH"
    - sh build/sign-release.sh
  artifacts:
    paths:
      - checksums.txt
      - provenance.json
      - checksums.txt.sig
      - release.asc # the OpenPGP public key, for the operator to publish via WKD (0011)
    expire_in: 1 week

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^n[0-9]/'
  needs:
    # build → the .wasm/.gz; sign → checksums.txt, provenance.json, the signature.
    - build:lgpl
    - build:gpl
    - build:lgpl:intermediate
    - build:gpl:intermediate
    - build:native:lgpl
    - build:native:gpl
    - sign
  variables:
    PKG: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ffmpeg-wasi/${CI_COMMIT_TAG}"
  script:
    - apk add --no-cache curl
    - |
      set -e
      # Publish every asset to the generic package registry (stable, pinnable
      # URLs). checksums.txt + provenance.json + checksums.txt.sig come from the
      # `sign` job; the modules from the build jobs.
      for f in ffmpeg-wasi-lgpl.wasm ffmpeg-wasi-lgpl.wasm.gz \
               ffmpeg-wasi-gpl.wasm ffmpeg-wasi-gpl.wasm.gz \
               ffmpeg-wasi-intermediate-lgpl.wasm ffmpeg-wasi-intermediate-lgpl.wasm.gz \
               ffmpeg-wasi-intermediate-gpl.wasm ffmpeg-wasi-intermediate-gpl.wasm.gz \
               ffmpeg-wasi-driver-linux-amd64-lgpl ffmpeg-wasi-driver-linux-amd64-lgpl.gz \
               ffmpeg-wasi-driver-linux-amd64-gpl ffmpeg-wasi-driver-linux-amd64-gpl.gz \
               checksums.txt checksums.txt.sig provenance.json; do
        echo "uploading $f"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" "${PKG}/${f}"
      done
    - |
      release-cli create \
        --name "ffmpeg-wasi ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --description "FFmpeg ${CI_COMMIT_TAG%-*} for WASI. Two licence variants — **lgpl** (default; H.264 encode via openh264) and **gpl** (libx264 H.264 encode) — each in two capability profiles: **lean** (web-delivery essentials, the \`ffmpeg-wasi-<variant>.wasm\` assets) and **intermediate** (lean + every practical software codec/filter — subtitles, LGPL encoders, native codec batch, text burn-in — the \`ffmpeg-wasi-intermediate-<variant>.wasm\` assets). Plus the **native Backend-B drivers** (\`ffmpeg-wasi-driver-linux-amd64-<variant>\`, spec 0028): our engine compiled to a native ELF with threads + SIMD for **48–58× faster software encode**, driven by afmpeg's native backend (\`native.WithNativeRelease\`) over an in-memory IPC bridge — CGO-free, signature-verified through the same manifest. Both variants encode H.264; the self-compiled openh264 carries an AVC patent caveat (see the licensing docs). The manifest is signed: \`checksums.txt.sig\` is a detached OpenPGP signature over \`checksums.txt\` from a KMS-held key (afmpeg verifies it via the org signing module against a pinned key). Pin a module by its URL + SHA-256 from \`checksums.txt\`; see \`provenance.json\` for exactly what went in." \
        --assets-link "{\"name\":\"ffmpeg-wasi-lgpl.wasm\",\"url\":\"${PKG}/ffmpeg-wasi-lgpl.wasm\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"ffmpeg-wasi-gpl.wasm\",\"url\":\"${PKG}/ffmpeg-wasi-gpl.wasm\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"ffmpeg-wasi-intermediate-lgpl.wasm\",\"url\":\"${PKG}/ffmpeg-wasi-intermediate-lgpl.wasm\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"ffmpeg-wasi-intermediate-gpl.wasm\",\"url\":\"${PKG}/ffmpeg-wasi-intermediate-gpl.wasm\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"ffmpeg-wasi-lgpl.wasm.gz\",\"url\":\"${PKG}/ffmpeg-wasi-lgpl.wasm.gz\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"ffmpeg-wasi-gpl.wasm.gz\",\"url\":\"${PKG}/ffmpeg-wasi-gpl.wasm.gz\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"ffmpeg-wasi-intermediate-lgpl.wasm.gz\",\"url\":\"${PKG}/ffmpeg-wasi-intermediate-lgpl.wasm.gz\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"ffmpeg-wasi-intermediate-gpl.wasm.gz\",\"url\":\"${PKG}/ffmpeg-wasi-intermediate-gpl.wasm.gz\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"ffmpeg-wasi-driver-linux-amd64-lgpl\",\"url\":\"${PKG}/ffmpeg-wasi-driver-linux-amd64-lgpl\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"ffmpeg-wasi-driver-linux-amd64-gpl\",\"url\":\"${PKG}/ffmpeg-wasi-driver-linux-amd64-gpl\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"checksums.txt\",\"url\":\"${PKG}/checksums.txt\",\"link_type\":\"other\"}" \
        --assets-link "{\"name\":\"checksums.txt.sig\",\"url\":\"${PKG}/checksums.txt.sig\",\"link_type\":\"other\"}" \
        --assets-link "{\"name\":\"provenance.json\",\"url\":\"${PKG}/provenance.json\",\"link_type\":\"other\"}"
