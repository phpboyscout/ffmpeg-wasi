# ffmpeg-wasi — custom release pipeline.
#
#   merge_request → validate (shellcheck the build scripts; fast)
#   tag nX.Y.Z-N  → build both variants → checksum + provenance → GitLab release
#
# Releases are cut by tagging `<FFMPEG_VERSION>-<build-rev>` (e.g. n8.1.2-1); the
# FFmpeg version is derived from the tag. The build is heavy (compiles FFmpeg);
# it runs only on tags and needs a Docker-capable runner with adequate
# CPU/disk/timeout.

include:
  # Docs site → GitLab Pages (zensical), consistent with the other phpboyscout projects.
  - component: gitlab.com/phpboyscout/cicd/zensical-pages@v0.18.1

stages:
  - validate
  - build
  - release
  - pages

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

validate:
  stage: validate
  # The alpine variant ships a shell (the scratch shellcheck image sets shellcheck
  # as its entrypoint, which collides with GitLab's script runner).
  image:
    name: koalaman/shellcheck-alpine:stable
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - shellcheck build/*.sh

# One job per licence variant; the FFmpeg version comes from the tag (strip the
# build-revision suffix, e.g. n8.1.2-1 -> n8.1.2). The job runs *in* the wasi-sdk
# image and invokes the build scripts directly — same as build/Dockerfile, but no
# Docker-in-Docker (so it runs on an ordinary container runner).
.build:
  stage: build
  image: ghcr.io/webassembly/wasi-sdk:wasi-sdk-30
  tags: [saas-linux-medium-amd64]
  rules:
    # Only FFmpeg-version tags (e.g. n8.1.2-1) build artifacts; repo-meta tags
    # like 0.1.0 do not trigger an FFmpeg build.
    - if: '$CI_COMMIT_TAG =~ /^n[0-9]/'
  timeout: 2h
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git make pkg-config gzip ca-certificates && rm -rf /var/lib/apt/lists/*
  script:
    - export FFMPEG_VERSION="${CI_COMMIT_TAG%-*}"
    - echo "Building ${VARIANT} for FFmpeg ${FFMPEG_VERSION}"
    - sh build/deps.sh
    - sh build/libav.sh
    - mkdir -p dist
    - OUT="dist/ffmpeg-wasi-${VARIANT}.wasm" sh build/driver.sh
    - cp "dist/ffmpeg-wasi-${VARIANT}.wasm" "ffmpeg-wasi-${VARIANT}.wasm"
    - gzip -k -9 "ffmpeg-wasi-${VARIANT}.wasm"
  artifacts:
    paths:
      - "ffmpeg-wasi-*.wasm*"
    expire_in: 1 week

build:lgpl:
  extends: .build
  variables:
    VARIANT: lgpl

build:gpl:
  extends: .build
  variables:
    VARIANT: gpl

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^n[0-9]/'
  needs:
    - build:lgpl
    - build:gpl
  variables:
    PKG: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ffmpeg-wasi/${CI_COMMIT_TAG}"
  script:
    - apk add --no-cache curl
    - |
      set -e
      FFMPEG_VERSION="${CI_COMMIT_TAG%-*}"
      sha256sum ffmpeg-wasi-*.wasm* | tee checksums.txt
      cat > provenance.json <<PROV
      {
        "ffmpeg_version": "${FFMPEG_VERSION}",
        "build_tag": "${CI_COMMIT_TAG}",
        "commit": "${CI_COMMIT_SHA}",
        "variants": {
          "lgpl": { "file": "ffmpeg-wasi-lgpl.wasm", "license": "LGPL-2.1-or-later" },
          "gpl":  { "file": "ffmpeg-wasi-gpl.wasm",  "license": "GPL-2.0-or-later" }
        },
        "tooling_license": "MIT"
      }
      PROV
      # Publish every asset to the generic package registry (stable, pinnable URLs).
      for f in ffmpeg-wasi-lgpl.wasm ffmpeg-wasi-lgpl.wasm.gz \
               ffmpeg-wasi-gpl.wasm ffmpeg-wasi-gpl.wasm.gz \
               checksums.txt provenance.json; do
        echo "uploading $f"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" "${PKG}/${f}"
      done
    - |
      release-cli create \
        --name "ffmpeg-wasi ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --description "FFmpeg ${CI_COMMIT_TAG%-*} for WASI — **lgpl** (default; H.264 decode, no libx264 encode) and **gpl** (adds libx264 H.264 encode). Pin a module by its URL + SHA-256 from \`checksums.txt\`; see \`provenance.json\` for exactly what went in." \
        --assets-link "{\"name\":\"ffmpeg-wasi-lgpl.wasm\",\"url\":\"${PKG}/ffmpeg-wasi-lgpl.wasm\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"ffmpeg-wasi-gpl.wasm\",\"url\":\"${PKG}/ffmpeg-wasi-gpl.wasm\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"ffmpeg-wasi-lgpl.wasm.gz\",\"url\":\"${PKG}/ffmpeg-wasi-lgpl.wasm.gz\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"ffmpeg-wasi-gpl.wasm.gz\",\"url\":\"${PKG}/ffmpeg-wasi-gpl.wasm.gz\",\"link_type\":\"package\"}" \
        --assets-link "{\"name\":\"checksums.txt\",\"url\":\"${PKG}/checksums.txt\",\"link_type\":\"other\"}" \
        --assets-link "{\"name\":\"provenance.json\",\"url\":\"${PKG}/provenance.json\",\"link_type\":\"other\"}"
