# ffmpeg-wasi — custom release pipeline.
#
#   merge_request → validate (shellcheck + the version guard; fast)
#                 → build the full matrix, but only when build/** or src/**
#                   changed (spec 0035); the matrix lives in build/engine.gitlab-ci.yml
#                 → size-budget over whatever was built
#   tag nX.Y.Z-N  → the same builds → checksum + provenance + signature → release
#
# Releases are cut by MERGING colophon's release merge request, which cuts the
# `<FFMPEG_VERSION>-<build-rev>` tag (e.g. n9.0.1-6) and so starts the pipeline
# above (afmpeg spec 0046). Nobody pushes that tag by hand; `n*` is protected.
#
# **build/ffmpeg-version.txt is authoritative for the FFmpeg version** (spec 0035
# D3), not the tag: the `ffmpeg-version` job fails a tag that disagrees with it,
# before any build starts. colophon computes the tag FROM that same file, so
# under normal operation that guard cannot fire — which is exactly why it is
# worth keeping now that a tool does the tagging. Bumping FFmpeg is still a
# merge request against that file, and that merge request still builds the new
# version; the ordinal restarts at 1 when the prefix moves.
#
# The build is heavy (it compiles FFmpeg) and needs a runner with adequate
# CPU/disk/timeout. Every build job shares one project-scoped `resource_group`
# (spec 0035 D7, following cicd 0045), so at most one engine compile runs at a
# time and a ten-job matrix cannot fill every slot on the shared runners. That
# trades wall clock — a full matrix is ~95 min rather than ~17 — for a fleet that
# stays usable by everything else. Do not remove it to speed a release up
# without reading that decision first.

include:
  # Docs site → GitLab Pages (zensical), consistent with the other phpboyscout projects.
  - component: gitlab.com/phpboyscout/cicd/zensical-pages@main

  # Nightly Renovate scan (schedule-gated on $RENOVATE_TASK=scan). Keeps the
  # pinned phpboyscout/cicd/zensical-pages ref (and build-script images) current
  # via the cicd preset extended in renovate.json. Runs only on the
  # renovate-daily schedule; validate/build/sign/release are MR/tag-gated and
  # zensical-pages carries its own schedule-never guard.

  # Announce releases to the Discord announcements channel. Minor and
  # major cuts only by default; the webhook comes from the
  # DISCORD_RELEASE_WEBHOOK group variable, which is protected and so
  # reaches this job because `v*` is a protected tag here.
  - component: gitlab.com/phpboyscout/cicd/discord-release@main

  # Releases through colophon (afmpeg spec 0046). It proposes a release merge
  # request on main, and cuts the nX.Y.Z-N tag when that merge request is
  # merged — which is what fires the tag pipeline below.
  #
  # tag_pattern is NOT the component's default: that one admits vX.Y.Z and the
  # component shapes, and nothing this project has ever tagged. Our versions
  # are an upstream FFmpeg release and a build ordinal (.colophon.yaml).
  - component: gitlab.com/phpboyscout/cicd/colophon@main
    inputs:
      tag_pattern: '^n[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$'
      # The component's default image bakes an older colophon that cannot read
      # this project's versions at all — it would read every n* tag as
      # not-a-version and propose a first release over the whole history.
      #
      # v0.1.12 carries colophon 0.10.1: the ordinal scheme, the named assets
      # below, and the fix for those two together. 0.10.0 had the assets
      # feature but refused to publish at all once a manifest named any, which
      # is what failed this project's first run.
      image: registry.gitlab.com/phpboyscout/images/release-tools:v0.1.12
      assets: true
      # Blank, deliberately. The component always passes --assets <dist> to
      # colophon, and colophon refuses a goreleaser dist and a named `assets`
      # list together — they are alternatives (colophon spec 0017 D2). There is
      # no goreleaser here, so the dist is emptied and the manifest's list is
      # the only source. Without this the first release fails with
      # "name assets in .colophon.yaml or pass --assets, not both".
      dist: ""
      asset_base: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/ffmpeg-wasi/$CI_COMMIT_TAG"
  # The engine build matrix. In its own file so `changes:` can name it: a
  # merge request that rewires the build rebuilds, one that edits release,
  # signing or pages does not.
  - local: build/engine.gitlab-ci.yml

stages:
  - validate
  - build
  - test
  - sign
  - release
  - notify
  - pages
  - renovate

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# The conformance suite runs on everything above — an artifact change is the reason
# it exists — AND on changes to the suite itself, which the build rules do not
# cover. Without this a merge request touching only internal/** got no pipeline job
# at all: the suite was not compiled, let alone run, so a test that did not build
# would reach the default branch unnoticed.
#
# On a suite-only merge request nothing is built, so every artifact-backed test
# skips (0036 D6) and what the job proves is that the suite compiles and its
# artifact-free assertions hold. That is much less than a full run, and it is
# deliberately not bought at the price of a ten-artifact build for a change that
# cannot alter an artifact — runner slots are the scarce resource (0035 D7).
.engine-test-rules: &engine-test-rules
  - if: '$CI_COMMIT_TAG =~ /^n[0-9]/'
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    changes:
      paths:
        - build/**/*
        - src/**/*
        - .gitlab-ci.yml
        - internal/**/*
        - tools/**/*
        - go.mod
        - go.sum

validate:
  stage: validate
  # The alpine variant ships a shell (the scratch shellcheck image sets shellcheck
  # as its entrypoint, which collides with GitLab's script runner).
  image:
    name: koalaman/shellcheck-alpine:v0.11.0
    entrypoint: [""]
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - shellcheck build/*.sh
    # The release links exactly what the signature covers. Cheap, and in
    # validate because a disagreement found after ninety minutes of compiles
    # is found too late to be worth much.
    - sh build/check-release-set.sh
    # A failing command in an AND-OR list does not stop a job (#68). Cheap to
    # check here, and the failure it prevents costs a whole pipeline to find.
    - sh build/check-ci-shell.sh .gitlab-ci.yml build/engine.gitlab-ci.yml

# Resolve — and on a tag, verify — the FFmpeg version, before anything expensive
# runs (spec 0035 D3). This is a whole stage ahead of `build`, so a tag that
# disagrees with build/ffmpeg-version.txt costs seconds instead of an hour of
# serialised compiles. Deliberately outside the build resource_group: a check this
# cheap must never queue behind a compile.
ffmpeg-version:
  stage: validate
  image: alpine:3.24.1
  interruptible: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^n[0-9]/'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    # Two statements, not `export FFMPEG_VERSION="$(...)"` — that reports export's
    # exit status (always 0) and would swallow the guard's failure.
    - version="$(sh build/ffmpeg-version.sh)"
    - echo "This pipeline targets FFmpeg ${version}"

# One job per licence variant; the FFmpeg version comes from the tag (strip the
# build-revision suffix, e.g. n8.1.2-1 -> n8.1.2). The job runs *in* the wasi-sdk
# image and invokes the build scripts directly — same as build/Dockerfile, but no
# Docker-in-Docker (so it runs on an ordinary container runner).
# The engine conformance suite (spec 0036). Runs against the artifacts the build
# stage just produced, asserting two things about each: that every component
# build/enable-lists.sh claims for a (profile, variant) is actually in the binary
# built from it — the check that catches a component silently dropped by an FFmpeg
# bump — and that the driver ABI behaves as documented, down to the exit codes.
#
# Deliberately NOT in the engine-build resource group: that group exists to stop
# ten parallel FFmpeg *compiles* exhausting the runners (0035 D7). This job
# compiles no C and runs in minutes, so serialising it behind the builds would add
# to an already long pipeline for no benefit (0036 D8).
test:
  stage: test
  image: registry.gitlab.com/phpboyscout/images/go-tools:v0.3.0
  rules: *engine-test-rules
  interruptible: true
  # Same optional needs as size-budget: run against whatever the pipeline built.
  # A missing artifact is a skipped subtest, never a failure.
  needs:
    - job: build:lgpl
      optional: true
    - job: build:gpl
      optional: true
    - job: build:lgpl:intermediate
      optional: true
    - job: build:gpl:intermediate
      optional: true
    - job: build:native:lgpl
      optional: true
    - job: build:native:gpl
      optional: true
    - job: build:native:lgpl:intermediate
      optional: true
    - job: build:native:gpl:intermediate
      optional: true
    - job: build:native:lgpl:full
      optional: true
    - job: build:native:gpl:full
      optional: true
  variables:
    # The build jobs deposit their artifacts in the job root; Discover() ignores
    # anything whose name it cannot parse, so pointing at the whole directory is
    # safe and needs no staging step.
    FFMPEG_WASI_ARTIFACTS: "$CI_PROJECT_DIR"
  before_script:
    # Artifact restore does not always preserve the executable bit on the native
    # drivers, and a driver that cannot be exec'd would look like a missing
    # capability rather than a permissions problem.
    - chmod +x ffmpeg-wasi-driver-linux-amd64-* 2>/dev/null || true
  script:
    - go test ./... -v

# Size-budget gate (spec 0022): print each artifact's size vs its budget in
# build/size-budget.txt and flag a profile that ballooned past its ceiling. Advisory
# (allow_failure) — it reports without blocking a release, until the seeded budgets
# are calibrated from a real build; flip allow_failure off to enforce.
size-budget:
  stage: sign
  image: alpine:3.24.1
  # Runs on engine merge requests too (spec 0035 D4), which is where a size
  # regression is worth seeing — the lean wasm module is at 93% of its 6 MB
  # ceiling on n9.0.1, and that is the number most likely to break the n9 bump.
  extends: .engine-build-rules
  interruptible: true
  # `optional: true` so the job runs against whatever the pipeline actually built.
  # check-size-budget.sh already skips absent artifacts and fails only on a
  # *present* artifact over its ceiling, so a partial set needs no script change.
  needs:
    - job: build:lgpl
      optional: true
    - job: build:gpl
      optional: true
    - job: build:lgpl:intermediate
      optional: true
    - job: build:gpl:intermediate
      optional: true
    - job: build:native:lgpl
      optional: true
    - job: build:native:gpl
      optional: true
    - job: build:native:lgpl:intermediate
      optional: true
    - job: build:native:gpl:intermediate
      optional: true
    - job: build:native:lgpl:full
      optional: true
    - job: build:native:gpl:full
      optional: true
  allow_failure: true
  script:
    - sh build/check-size-budget.sh

# Sign the release manifest. Tag-gated; uses GitLab OIDC to assume the
# ffmpeg-wasi signer role, then `gtb` mints the OpenPGP public key from the KMS
# key and signs checksums.txt with a detached OpenPGP signature (afmpeg spec
# 0010, via gitlab.com/phpboyscout/signing). The signer role's trust policy
# (phpboyscout/infra) pins it to this project's `n*` tag pipelines.
sign:
  stage: sign
  image: registry.gitlab.com/phpboyscout/images/go-tools:v0.3.0
  # Tag-only, unconditionally, and its `needs` stay mandatory (spec 0035 D5). A
  # merge request must never assume the signing role, mint a signature or publish.
  # The `optional: true` relaxation on size-budget must not spread here.
  rules:
    - if: '$CI_COMMIT_TAG =~ /^n[0-9]/'
  needs:
    - build:lgpl
    - build:gpl
    - build:lgpl:intermediate
    - build:gpl:intermediate
    - build:native:lgpl
    - build:native:gpl
    - build:native:lgpl:intermediate
    - build:native:gpl:intermediate
    - build:native:lgpl:full
    - build:native:gpl:full
  id_tokens:
    AWS_WEB_IDENTITY_TOKEN:
      # The IAM OIDC provider hardcodes client_id_list=["sts.amazonaws.com"];
      # the signer role's trust policy matches via oidc_audience. AWS checks
      # this `aud` before the role's trust condition.
      aud: sts.amazonaws.com
  variables:
    AWS_REGION: eu-west-2
    AWS_ROLE_ARN: arn:aws:iam::060730976733:role/ffmpeg-wasi-release-signing-v2-signer
    AWS_ROLE_SESSION_NAME: ffmpeg-wasi-release-${CI_COMMIT_TAG}
    # A job variable, not a before_script export — GitLab runs each script line
    # in its own shell, so exports don't persist (gtb's aws-kms backend reads
    # this path + AWS_ROLE_ARN to assume the role via web-identity).
    AWS_WEB_IDENTITY_TOKEN_FILE: /tmp/oidc-token
    # v2, in the prod account, is the sole signer since the 2026-07-24
    # rotation; the old account and its v1 private key are gone. afmpeg keeps
    # the v1 PUBLIC key so releases signed before then keep verifying.
    SIGNING_KEY_ALIAS: alias/ffmpeg-wasi-release-signing-v2
    # The OpenPGP UID + creation time are FIXED so every mint reproduces the same
    # key fingerprint (4C96ECB35C7446619FF78EB1ED1344E576B7BBBF) — the one afmpeg
    # >= v0.12.0 pins. Changing any of these rotates the key.
    SIGNING_KEY_NAME: ffmpeg-wasi Release Signing
    SIGNING_KEY_EMAIL: ffmpeg-wasi-release-v2@phpboyscout.uk
    SIGNING_KEY_CREATED: "2026-07-24T11:43:51Z"
    # The >= below is a floor, not a ceiling — a Renovate bump above it is safe.
    # renovate: datasource=gitlab-tags depName=phpboyscout/go-tool-base
    GTB_VERSION: v0.43.0
    GOPRIVATE: gitlab.com/phpboyscout/*
  before_script:
    # Install gtb from the private module registry (CI-token git auth), then
    # stage the OIDC token for the AWS SDK credential chain.
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf "https://gitlab.com/"
    - go install "gitlab.com/phpboyscout/go-tool-base/cmd/gtb@${GTB_VERSION}"
    - echo "$AWS_WEB_IDENTITY_TOKEN" > "$AWS_WEB_IDENTITY_TOKEN_FILE"
  script:
    - export PATH="$(go env GOPATH)/bin:$PATH"
    - sh build/sign-release.sh
  artifacts:
    paths:
      - checksums.txt
      - provenance.json
      - checksums.txt.sig
      - release.asc # the OpenPGP public key, for the operator to publish via WKD (0011)
    expire_in: 1 week

# Uploads every artefact to the generic package registry, and stops there.
#
# It used to create the release object too, with release-cli and seventeen
# --assets-link arguments. colophon-release does that now, from the `assets`
# list in .colophon.yaml, and checks every one of them resolves before it
# publishes anything — which is a check this job never had (afmpeg spec 0046
# D4, colophon spec 0017).
upload:
  stage: release
  image: alpine:3.24.1
  rules:
    - if: '$CI_COMMIT_TAG =~ /^n[0-9]/'
  needs:
    # build → the .wasm/.gz; sign → checksums.txt, provenance.json, the signature.
    - build:lgpl
    - build:gpl
    - build:lgpl:intermediate
    - build:gpl:intermediate
    - build:native:lgpl
    - build:native:gpl
    - build:native:lgpl:intermediate
    - build:native:gpl:intermediate
    - build:native:lgpl:full
    - build:native:gpl:full
    - sign
  variables:
    PKG: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ffmpeg-wasi/${CI_COMMIT_TAG}"
  script:
    - apk add --no-cache curl
    - |
      set -e
      # Publish every asset to the generic package registry (stable, pinnable
      # URLs). checksums.txt + provenance.json + checksums.txt.sig come from the
      # `sign` job; the modules from the build jobs.
      # The set to upload is READ from checksums.txt rather than repeated
      # here. That file is the signed set: build/sign-release.sh puts exactly
      # these names through sha256sum, and checksums.txt.sig certifies the
      # result, so deriving the list makes it impossible to upload something
      # unsigned or to miss something signed.
      #
      # It used to be a literal list, and n9.0.1-6 is what that cost: six
      # gzipped native drivers were built, signed and uploaded, and then not
      # offered on the release, because a second list had been written once
      # and never compared with the first.
      #
      # checksums.txt and its signature are appended: they cannot appear in a
      # checksum of themselves.
      for f in $(awk '{print $2}' checksums.txt) checksums.txt checksums.txt.sig; do
        echo "uploading $f"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" "${PKG}/${f}"
      done

# colophon-release creates the release object from .colophon.yaml's `assets`
# list, so it must not run until those files are actually in the registry.
#
# The component's own `needs` names goreleaser and nothing else, optionally.
# This project has no goreleaser, so that need resolves to nothing and the job
# would otherwise start at pipeline time — before a single artefact existed —
# and refuse the release because none of its assets resolve.
colophon-release:
  needs:
    - job: upload
      artifacts: false
