[project]
site_name = "ffmpeg-wasi"
site_description = "Current FFmpeg as a sandboxed WASI module — libav-direct, pure-Go-runnable, CGO-free."
site_author = "Matt Cockayne"
site_url = "https://ffmpeg-wasi.phpboyscout.uk"
repo_url = "https://gitlab.com/phpboyscout/ffmpeg-wasi"
repo_name = "ffmpeg-wasi"
copyright = "Copyright &copy; 2026 Matt Cockayne"
extra_css = ["stylesheets/extra.css"]

[project.theme]
logo = "images/branding/logo_transparent.svg"
favicon = "images/branding/favicon.svg"
language = "en"
features = [
    "content.code.annotate",
    "content.code.copy",
    "content.tabs.link",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.font]
text = "Inter"
code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

